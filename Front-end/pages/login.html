<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mundo Encantado</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CSS Global -->
    <link href="../assets/css/style.css" rel="stylesheet">
    <!-- CSS Específico do Login -->
    <link href="../assets/css/login.css" rel="stylesheet">
</head>
<body>
    
    <div class="login-wrapper">
       <!-- Card Central -->
       <div class="login-container">
           <div class="login-card">
               <div class="login-header text-center mb-4">
                   <div class="logo-placeholder">
                       <img src="../assets/img/Logo.jpg" alt="Instituto Educacional Mundo Encantado" id="mainLogo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                       <div class="logo-fallback" style="display: none;">
                           <span>Logo</span>
                       </div>
                   </div>
                   <h2 class="mt-3 mb-0 text-dark" style="font-size: 1.15rem; font-weight: 800;">Sistema Escolar</h2>
                   <p class="text-muted mt-1" style="font-size: 0.75rem; font-weight: 700;">Acesso restrito a funcionários</p>
               </div>
               
               <form id="loginForm">
                   <div class="form-group mb-3 text-start">
                       <label for="email" class="form-label">E-mail institucional:</label>
                       <input type="email" class="form-control-custom w-100" id="email" placeholder="@gmail.com" required>
                   </div>
                   
                   <div class="form-group mb-4 text-start">
                       <label for="password" class="form-label">Senha:</label>
                       <div class="password-container position-relative">
                           <input type="password" class="form-control-custom w-100" id="password" placeholder="**********" required>
                           <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Mostrar senha">
                               <i class="bi bi-eye"></i>
                           </button>
                       </div>
                   </div>
                   
                   <div class="text-center mt-4">
                       <button type="submit" class="btn-login w-100 py-2 mb-3" id="btnLogin">Entrar no Sistema</button>
                       <a href="#" class="text-dark text-decoration-none" style="font-size: 0.8rem; font-weight: 700;">Esqueci minha senha</a>
                   </div>
               </form>
               
               <!-- Alerta que fica flutuando na borda inferior do card -->
               <div id="loginAlert" class="login-alert d-none">
                   E-mail ou senha inválidos. Tente novamente.
               </div>
           </div>
       </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS Global -->
    <script src="../assets/js/main.js"></script>
    <!-- JS Específico do Login -->
    <script src="../assets/js/login.js"></script>
</body>
</html>
