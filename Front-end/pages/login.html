<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mundo Encantado</title>
    <meta name="description" content="Acesso ao Sistema de Gestão Escolar — Instituto Educacional Mundo Encantado">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/login.css" rel="stylesheet">
</head>
<body>

<!-- ── Wrapper: Bootstrap substitui min-height, flex, align, justify, padding ── -->
<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 py-4 px-3">
    <div class="login-container w-100">
        <div class="login-card position-relative" id="loginCard">

            <!-- Header -->
            <div class="text-center mb-4">
                <div class="logo-placeholder mx-auto mb-3">
                    <img src="../assets/img/Logo.jpg"
                         alt="Mundo Encantado"
                         onerror="this.parentElement.innerHTML='<i class=\'bi bi-mortarboard-fill logo-fallback-icon\'></i>'">
                </div>
                <h1 class="fs-5 fw-black mb-1">Sistema Escolar</h1>
                <p class="small text-muted mb-0">Acesso restrito a funcionários</p>
            </div>

            <!-- Formulário -->
            <form id="loginForm" novalidate>

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small">E-mail institucional:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control-custom w-100"
                        placeholder="admin@gmail.com"
                        autocomplete="email"
                        required>
                </div>

                <!-- Senha -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold small">Senha:</label>
                    <div class="password-container position-relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control-custom w-100"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required>
                        <button type="button" id="togglePassword" class="btn-eye" aria-label="Mostrar/ocultar senha">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login w-100 mb-3" id="btnLogin">
                    <span id="btnLoginText">Entrar no Sistema</span>
                </button>

                <!-- Esqueci Senha -->
                <div class="text-center">
                    <a href="#" id="linkEsqueci" class="login-link small">Esqueci minha senha</a>
                </div>

            </form>

            <!-- Alerta flutuante -->
            <div id="loginAlert" class="login-alert d-none" role="alert">
                <i class="bi bi-exclamation-circle-fill me-1" id="loginAlertIcon"></i>
                <span id="loginAlertMsg">E-mail ou senha inválidos.</span>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/login.js"></script>
</body>
</html>
