<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Mundo Encantado</title>
    <meta name="description" content="Página não encontrada - Sistema de Gestão Escolar Mundo Encantado">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cor-fundo);
            background-image: url('../assets/img/Fundo-global.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .erro-card {
            background: var(--cor-fundo-card);
            border-radius: var(--border-radius-lg);
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .erro-numero {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            color: var(--cor-primaria);
            letter-spacing: -4px;
        }

        .erro-emoji {
            font-size: 3.5rem;
            display: block;
            margin: 0.5rem 0;
            animation: balancar 2s ease-in-out infinite;
        }

        @keyframes balancar {
            0%, 100% { transform: rotate(-8deg); }
            50%       { transform: rotate(8deg); }
        }

        .erro-titulo {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 1rem 0 0.5rem;
        }

        .erro-msg {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--cor-texto-secundario);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .erro-btns {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-voltar {
            background-color: #ebf3fc;
            border: 2px solid var(--cor-primaria);
            color: var(--cor-primaria);
            border-radius: var(--border-radius-sm);
            padding: 0.65rem 1.5rem;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-padrao);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-voltar:hover {
            background-color: var(--cor-primaria);
            color: white;
            transform: translateY(-2px);
        }

        .btn-dash {
            background-color: #dcfce7;
            border: 2px solid var(--cor-sucesso);
            color: #16a34a;
            border-radius: var(--border-radius-sm);
            padding: 0.65rem 1.5rem;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-padrao);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-dash:hover {
            background-color: var(--cor-sucesso);
            color: white;
            transform: translateY(-2px);
        }

        /* Decorações */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.06;
            background: var(--cor-primaria);
        }

        .deco-circle.c1 { width: 200px; height: 200px; top: -60px; right: -60px; }
        .deco-circle.c2 { width: 120px; height: 120px; bottom: -40px; left: -40px; }

        .deco-stars {
            position: absolute;
            font-size: 1rem;
            opacity: 0.12;
            color: var(--cor-aviso);
        }

        .deco-stars.s1 { top: 20px; left: 20px; }
        .deco-stars.s2 { top: 40px; right: 30px; font-size: 0.7rem; }
        .deco-stars.s3 { bottom: 30px; right: 20px; }

        /* Countdown */
        .redirect-info {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cor-texto-secundario);
            margin-top: 1.5rem;
        }

        .redirect-info span {
            color: var(--cor-primaria);
            font-weight: 800;
        }

        @media (max-width: 480px) {
            .erro-numero { font-size: 4.5rem; }
            .erro-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="erro-card">
        <!-- Decorações -->
        <div class="deco-circle c1"></div>
        <div class="deco-circle c2"></div>
        <i class="bi bi-star-fill deco-stars s1"></i>
        <i class="bi bi-star-fill deco-stars s2"></i>
        <i class="bi bi-star-fill deco-stars s3"></i>

        <!-- Conteúdo -->
        <div class="erro-numero">404</div>
        <span class="erro-emoji">🎒</span>
        <h1 class="erro-titulo">Ops! Página não encontrada</h1>
        <p class="erro-msg">
            Parece que esta página foi de férias! 🌴<br>
            O endereço que você tentou acessar não existe ou foi movido.<br>
            Verifique a URL ou volte ao painel principal.
        </p>

        <div class="erro-btns">
            <a href="javascript:history.back()" class="btn-voltar">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <a href="dashboard.html" class="btn-dash">
                <i class="bi bi-grid-1x2-fill"></i> Ir ao Dashboard
            </a>
        </div>

        <p class="redirect-info">
            Redirecionando automaticamente em <span id="countdown">10</span>s...
        </p>
    </div>

    <script>
        // Countdown redirect
        let segundos = 10;
        const el = document.getElementById('countdown');
        const timer = setInterval(() => {
            segundos--;
            el.textContent = segundos;
            if (segundos <= 0) {
                clearInterval(timer);
                window.location.href = 'dashboard.html';
            }
        }, 1000);
    </script>

</body>
</html>
