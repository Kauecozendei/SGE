<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Mundo Encantado</title>
    <meta name="description" content="Agenda escolar - Sistema de Gestão Escolar">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/dashboard.css" rel="stylesheet">
    <link href="../assets/css/agenda.css" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex align-items-center gap-3">
            <img src="../assets/img/Logo.jpg" alt="Mundo Encantado" class="sidebar-logo" onerror="this.style.display='none'">
            <span class="sidebar-title">Mundo Encantado</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"    class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="alunos.html"       class="sidebar-link"><i class="bi bi-people-fill"></i><span>Alunos</span></a>
            <a href="professores.html"  class="sidebar-link"><i class="bi bi-person-video3"></i><span>Professores</span></a>
            <a href="funcionarios.html" class="sidebar-link"><i class="bi bi-person-workspace"></i><span>Funcionários</span></a>
            <a href="turmas.html"       class="sidebar-link"><i class="bi bi-bookmark-star-fill"></i><span>Turmas</span></a>
            <a href="entrada-saida.html" class="sidebar-link"><i class="bi bi-door-open-fill"></i><span>Entrada / Saída</span></a>
            <a href="agenda.html"       class="sidebar-link active"><i class="bi bi-calendar-event-fill"></i><span>Agenda</span></a>
            <a href="financeiro.html"   class="sidebar-link"><i class="bi bi-cash-coin"></i><span>Financeiro</span></a>
            <a href="relatorios.html"   class="sidebar-link"><i class="bi bi-file-earmark-bar-graph-fill"></i><span>Relatórios</span></a>
            <a href="perfil.html"       class="sidebar-link"><i class="bi bi-gear-fill"></i><span>Configurações</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="sidebar-link text-danger" id="btnSair">
                <i class="bi bi-box-arrow-left"></i><span>Sair</span>
            </a>
        </div>
    </aside>

    <!-- Conteúdo -->
    <main class="content-area agenda-page">
        <header class="topbar d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
            <div class="d-flex align-items-center gap-3">
                <button class="btn-menu" id="btnMenu" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                <div>
                    <h1 class="topbar-title mb-0">Agenda</h1>
                    <small class="topbar-date text-muted" id="dataAtual"></small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3 flex-shrink-0">
                <span class="topbar-greeting d-none d-md-block">Olá, Administrador 👋</span>
                <div class="topbar-avatar"><i class="bi bi-person-fill"></i></div>
            </div>
        </header>

        <!-- Header Calendário -->
        <div class="agenda-corpo">
        <div class="agenda-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
            <div class="agenda-nav d-flex align-items-center gap-2">
                <button class="btn-agenda-nav" id="btnMesAnterior" title="Mês anterior">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <span class="agenda-mes-titulo" id="agendaMesTitulo">Maio 2026</span>
                <button class="btn-agenda-nav" id="btnProximoMes" title="Próximo mês">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <button class="btn-novo-evento" data-bs-toggle="modal" data-bs-target="#modalEvento">
                <i class="bi bi-plus-lg"></i> Novo Evento
            </button>
        </div>

        <div class="row g-2 g-lg-3 agenda-layout">
            <!-- Calendário -->
            <div class="col-12 col-lg-7 col-xl-8 agenda-col-calendario">
                <div class="calendario-scroll">
                <div class="calendario-wrapper">
                    <!-- Dias da semana -->
                    <div class="calendario-dias-semana">
                        <div class="calendario-dia-semana">Dom</div>
                        <div class="calendario-dia-semana">Seg</div>
                        <div class="calendario-dia-semana">Ter</div>
                        <div class="calendario-dia-semana">Qua</div>
                        <div class="calendario-dia-semana">Qui</div>
                        <div class="calendario-dia-semana">Sex</div>
                        <div class="calendario-dia-semana">Sáb</div>
                    </div>
                    <!-- Grid gerado por JS -->
                    <div class="calendario-grid" id="calendarioGrid"></div>
                </div>
                </div>

                <!-- Legenda -->
                <div class="agenda-legenda d-flex gap-3 flex-wrap mt-2 mb-0">
                    <span><span class="evento-chip reuniao agenda-legenda-dot">●</span> Reunião</span>
                    <span><span class="evento-chip prova agenda-legenda-dot">●</span> Prova</span>
                    <span><span class="evento-chip evento agenda-legenda-dot">●</span> Evento</span>
                    <span><span class="evento-chip lembrete agenda-legenda-dot">●</span> Lembrete</span>
                    <span><span class="evento-chip feriado agenda-legenda-dot">●</span> Feriado</span>
                </div>
            </div>

            <div class="col-12 col-lg-5 col-xl-4 agenda-col-eventos">
                <div class="card-padrao agenda-painel-eventos">
                    <div class="agenda-painel-header">
                        <h5 class="agenda-painel-titulo mb-0">
                            <i class="bi bi-list-ul me-2"></i>Eventos do Mês
                        </h5>
                    </div>
                    <div class="agenda-filtros d-flex flex-wrap gap-2">
                        <button type="button" class="filtro-tipo-btn active" data-tipo="">Todos</button>
                        <button type="button" class="filtro-tipo-btn" data-tipo="reuniao">Reunião</button>
                        <button type="button" class="filtro-tipo-btn" data-tipo="prova">Prova</button>
                        <button type="button" class="filtro-tipo-btn" data-tipo="evento">Evento</button>
                        <button type="button" class="filtro-tipo-btn" data-tipo="lembrete">Lembrete</button>
                    </div>
                    <div class="eventos-lista-scroll">
                        <div class="eventos-lista" id="eventosLista" role="list">
                            <!-- preenchido por JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>

    </main>
</div>

<!-- Modal Novo Evento -->
<div class="modal fade modal-evento" id="modalEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEventoTitle">
                    <i class="bi bi-calendar-plus-fill me-2"></i>Novo Evento
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="formEvento">
                    <div class="mb-3">
                        <label class="form-label" for="inputTituloEvento">Título *</label>
                        <input type="text" class="form-control-custom" id="inputTituloEvento" name="titulo" placeholder="Nome do evento" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="inputDataEvento">Data *</label>
                            <input type="date" class="form-control-custom" id="inputDataEvento" name="data" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="inputHoraEvento">Hora</label>
                            <input type="time" class="form-control-custom" id="inputHoraEvento" name="hora">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="selectTipoEvento">Tipo *</label>
                        <select class="form-control-custom" id="selectTipoEvento" name="tipo" required>
                            <option value="">Selecionar tipo</option>
                            <option value="reuniao">Reunião</option>
                            <option value="prova">Prova / Avaliação</option>
                            <option value="evento">Evento Escolar</option>
                            <option value="lembrete">Lembrete</option>
                            <option value="feriado">Feriado</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="inputDescEvento">Descrição</label>
                        <textarea class="form-control-custom" id="inputDescEvento" name="descricao" rows="2" placeholder="Detalhes do evento..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn-salvar" id="btnSalvarEvento">
                    <i class="bi bi-check-lg me-1"></i>Salvar Evento
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/agenda.js"></script>
</body>
</html>
