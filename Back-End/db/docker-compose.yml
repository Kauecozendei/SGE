services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-SGE
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: BancoSGE
      MYSQL_USER: fatec
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Importa o banco de dados automaticamente na primeira inicialização:
      - ./DatabaseSGE.sql:/docker-entrypoint-initdb.d/init.sql:ro
      
  php:
    build:
      context: ..
      dockerfile: db/Dockerfile
    container_name: php-SGE
    ports:
      - "8080:8000"
    volumes:
      # Mapeia a pasta raiz SGE inteira para servir o Front-end e o Back-End juntos:
      - ../../:/app
    working_dir: /app
    depends_on:
      - mariadb
    command: php -S 0.0.0.0:8000

volumes:
  mariadb_data:
